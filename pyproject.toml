[project]
name = "photo2mesh"
version = "0.1.0"
description = "Create a 3D mesh from one or more photos of a sculpture"
requires-python = ">=3.11,<3.13"
dependencies = [
    "einops>=0.8.2",
    "huggingface-hub>=0.36.2",
    "imageio>=2.38.1",
    "numpy>=2.4.6",
    "omegaconf>=2.4.0",
    "open3d>=0.20.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "pycolmap>=4.2.1",
    "rembg[cpu]>=2.0.86",
    "scikit-image>=0.26.0",
    "scipy>=1.17.1",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "transformers<5",
    "trimesh>=5.2.0",
    "xatlas>=0.0.11",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
markers = ["slow: end-to-end runs that take minutes"]
testpaths = ["tests"]
